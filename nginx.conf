# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name 3.82.138.12;
    return 301 https://$host$request_uri;
}

# Serve HTTPS traffic
server {
    listen 443 ssl;
    server_name 3.82.138.12;

    ssl_certificate /etc/ssl/certs/selfsigned.crt;
    ssl_certificate_key /etc/ssl/private/selfsigned.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Serve static assets for the React app from the subdirectory
    location /ecommDotComm/static/ {
        try_files $uri $uri/ =404;
    }
    
    # Fallback to index.html for client-side routing in the React app
    location /ecommDotComm/ {
        try_files $uri $uri/ /ecommDotComm/index.html;
    }
    
    # Reverse proxy block to forward API calls to your backend container
    location /api/ {
        proxy_pass http://backend:4000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

