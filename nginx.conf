# Redirect HTTP to HTTPS (for local testing, using localhost)
server {
    listen 80;
   #server_name 3.82.138.12;
    server_name localhost;
    return 301 https://$host$request_uri;
}

# Serve HTTPS traffic on localhost
server {
    listen 443 ssl;
   #server_name 3.82.138.12;
    server_name localhost;

    ssl_certificate /etc/ssl/certs/selfsigned.crt;
    ssl_certificate_key /etc/ssl/private/selfsigned.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Serve your React app from the /ecommDotComm subdirectory as defined by "homepage"
    location /ecommDotComm/ {
        try_files $uri $uri/ /ecommDotComm/index.html;
    }
    
    # Reverse proxy for API calls (if you choose to proxy API calls)
#    location /api/ {
#        proxy_pass http://localhost:4000/;
#        proxy_set_header Host $host;
#        proxy_set_header X-Real-IP $remote_addr;
#    }
}

