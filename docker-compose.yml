services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:80"
      - "8443:443"
    environment:

      #- REACT_APP_API_BASE_URL=/api
      - REACT_APP_API_BASE_URL=http://localhost:4000
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - backend

  backend:
    build:
      context: ./ecommAPI
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
    volumes:
      - ./ecommAPI:/app
      - /app/node_modules
    command: ["node", "server.js"]

