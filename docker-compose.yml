services:
  frontend:
    build: .
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    # Volumes are omitted here because the multi-stage build copies the static files into the image.
    # You also no longer need CHOKIDAR_USEPOLLING since you're not using the development server.
    
  backend:
    build: ./ecommAPI
    ports:
      - "4000:4000"
    volumes:
      - ./ecommAPI:/app
      - /app/node_modules
    command: ["node", "server.js"]

